version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 24 && nvm use 24
        - node -v && npm -v
        # npm ci rejects the lockfile: nested @aws-amplify/plugin-types copies pin
        # exact deps that npm omits from it. npm install tolerates that.
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
